services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-churn-predict-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=BankChurnPredict
      - APP_ENV=production
      - MODEL_PATH=models/best_model.joblib
      - PREPROCESSOR_PATH=models/preprocessor.joblib
      - MODEL_METADATA_PATH=models/model_metadata.json
      - DATABASE_URL=sqlite:////app/data/bankchurnpredict.db
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-churn-predict-dashboard
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db_data:
